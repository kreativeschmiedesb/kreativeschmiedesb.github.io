<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreativeschmiede SB</title>
<meta name="description" content="Kreativeschmiede SB – handgemachte Geschenke und Deko aus kleiner Auflage.">
<style>
  :root {
    --ground: #FAF8F5;
    --ink: #241F1C;
    --ink-soft: #4A423D;
    --muted: #7A6E66;
    --line: #E4DBD0;
    --accent: #A85A3C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #17140F;
      --ink: #F0E9E2;
      --ink-soft: #CFC5BC;
      --muted: #9C9088;
      --line: #35302A;
      --accent: #D68F6E;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--ground); color: var(--ink);
    font: 16px/1.65 -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    display: grid; place-items: center; padding: 2rem 1.5rem;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; text-align: center; }
  .eyebrow {
    font-size: .78rem; letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 1rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.1;
    letter-spacing: -.025em; margin: 0 0 1rem;
  }
  p { color: var(--ink-soft); margin: 0 0 2rem; }
  .links { display: flex; gap: .8rem; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: .7rem 1.5rem; border-radius: 6px;
    text-decoration: none; font-weight: 600; font-size: .95rem;
    border: 1px solid var(--line); color: var(--ink);
  }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  a.btn:hover { border-color: var(--accent); }
  a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Handgemacht in kleiner Auflage</div>
  <h1>Kreativeschmiede SB</h1>
  <p>Geschenke und Deko, jedes Stück von Hand gefertigt. Der Shop liegt auf Etsy.</p>
  <div class="links">
    <a class="btn primary" href="https://kreativeschmiedesb.etsy.com">Zum Etsy-Shop</a>
    <a class="btn" href="./datenschutz.html">Datenschutzerklärung</a>
  </div>
  <footer>© 2026 Kreativeschmiede SB</footer>
</main>
</body>
</html>
